name: iOS simulator smoke test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  match:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Verify shuttle aerodynamics
        run: |
          xcrun --sdk macosx swiftc -O Shuttle/BadmintonPhysics.swift Tests/Physics/main.swift -o "$RUNNER_TEMP/flight-tests"
          "$RUNNER_TEMP/flight-tests"
      - name: Test on iPhone 16
        run: |
          xcodebuild -version
          xcodebuild test \
            -project Shuttle.xcodeproj \
            -scheme Shuttle \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/ShuttleSmoke.xcresult"
      - name: Save test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShuttleSmoke
          path: ${{ runner.temp }}/ShuttleSmoke.xcresult
          if-no-files-found: warn
          retention-days: 7
